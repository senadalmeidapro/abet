<header class="header">
  <div class="header-inner">
    <a class="brand" routerLink="/">
      <img src="/logo_abet_head2.png" alt="ABET for Africa" />
    </a>

    <button
      class="menu-toggle"
      type="button"
      (click)="menuOpen = !menuOpen"
      [class.is-open]="menuOpen"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      id="primary-navigation"
      class="nav"
      [class.open]="menuOpen"
    >
      @for (item of nav; track item.path) {
        <a
          [routerLink]="item.path"
          [class.active]="isActive(item.path)"
          (click)="menuOpen = false"
        >
          {{ item.label }}
        </a>
      }
      <a class="nav-contact" routerLink="/contact" (click)="menuOpen = false">
        Contact
      </a>
    </nav>
  </div>
</header>
