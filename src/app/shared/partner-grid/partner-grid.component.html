<div class="partner-grid" [class.compact]="compact">
  @for (partner of partners; track partner.name) {
    <article class="partner-cell" data-aos="zoom-in-up" [attr.data-aos-delay]="$index * 250">
      @if (descriptions[$index]?.url) {
        <a
          class="partner-logo-link"
          [href]="descriptions[$index].url"
          target="_blank"
          rel="noopener noreferrer"
          [attr.aria-label]="partner.name"
        >
          <img
            [class]="'partner-logo ' + partner.logoClass"
            [src]="partner.src"
            [alt]="(language.lang() === 'en' ? 'Logo of ' : 'Logo de ') + partner.name"
            loading="lazy"
            decoding="async"
          />
        </a>
      } @else {
        <img
          [class]="'partner-logo ' + partner.logoClass"
          [src]="partner.src"
          [alt]="(language.lang() === 'en' ? 'Logo of ' : 'Logo de ') + partner.name"
          loading="lazy"
          decoding="async"
        />
      }
      @if (!compact) {
        <p class="partner-description">{{ descriptions[$index]?.description }}</p>
      }
    </article>
  }
</div>
