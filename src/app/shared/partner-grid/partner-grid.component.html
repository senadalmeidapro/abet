<div class="partner-grid" [class.compact]="compact">
  @for (partner of partners; track partner.name) {
    <div class="partner-cell">
      <img
        [class]="'partner-logo ' + partner.logoClass"
        [src]="partner.src"
        [alt]="partner.name"
        loading="lazy"
        decoding="async"
      />
    </div>
  }
</div>
