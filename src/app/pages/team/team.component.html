<section class="page-hero page-hero--flat team-hero">
  <div class="page-copy">
    <h1>{{ language.t('team.heroTitle') }}</h1>
    <p class="lead on-dark">{{ language.t('team.heroLead') }}</p>
  </div>
</section>

@if (members.length) {
  <section class="section team-content">
    <div class="team-grid">
      @for (member of members; track $index) {
        <article class="team-card">
          <img
            class="team-photo"
            [src]="member.photo"
            [alt]="'Portrait de ' + member.name"
            loading="lazy"
            decoding="async"
          />
          <div class="team-card-body">
            <h2>{{ member.name }}</h2>
            <p class="team-role">{{ member.role }}</p>
            <p class="team-bio">{{ member.bio }}</p>
          </div>
        </article>
      }
    </div>
  </section>
}
