<section class="page-hero page-hero--image services-hero">
  <div class="page-copy">
    <h1>{{ c.heroTitle }}</h1>
    <p class="lead on-dark">{{ c.heroLead }}</p>
    <div class="actions"><a class="button primary" [routerLink]="language.localizePath('/contact')">{{ language.t('common.contactUs') }}</a></div>
  </div>
</section>
<section class="section">
  <div class="section-head"><div><h2>{{ c.expertiseTitle }}</h2></div></div>
  <div class="service-grid">
    @for (item of c.items; track item.title; let i = $index) {
      <article data-aos="fade-up" [attr.data-aos-delay]="(i % 3) * 100">
        <h3>{{ item.title }}</h3>
        <p>{{ item.text }}</p>
      </article>
    }
  </div>
</section>
<section class="section contact-cta"><div><h2>{{ language.t('common.contactUs') }}</h2></div><a class="button primary" [routerLink]="language.localizePath('/contact')">{{ language.t('common.contactUs') }}</a></section>
